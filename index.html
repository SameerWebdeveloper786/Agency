
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sameer Digital Lab | Premium Digital Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #050816;
        color: #e5e7eb;
        overflow-x: hidden;
      }
      .neon-glow {
        box-shadow: 0 0 5px rgba(45, 212, 191, 0.4), 0 0 10px rgba(45, 212, 191, 0.3), 0 0 15px rgba(45, 212, 191, 0.2);
      }
      .neon-glow-purple {
        box-shadow: 0 0 5px rgba(139, 92, 246, 0.4), 0 0 10px rgba(139, 92, 246, 0.3), 0 0 15px rgba(139, 92, 246, 0.2);
      }
      .text-glow {
        text-shadow: 0 0 8px rgba(45, 212, 191, 0.5);
      }
      .scroll-animation {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .scroll-animation.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .gradient-text {
        background: linear-gradient(90deg, #5EEAD4, #A78BFA);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
      }
      .animated-gradient-bg {
        background-size: 200% 200%;
        background-image: linear-gradient(-45deg, #050816, #1d1836, #050816, #111827);
        animation: gradient 15s ease infinite;
      }
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .page-enter {
        animation: pageFadeIn 0.5s forwards;
      }
      @keyframes pageFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
